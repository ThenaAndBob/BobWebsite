<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: bubbles;
            src: url(bubbles.ttf);
        }
        @font-face {
            font-family: actualbubbles;
            src: url(Bubbles-Regular.ttf);
        }
    
        .bob {
            text-align: center;
            font-family: bubbles;
        }

        body {
            background-image: url('https://i.imgur.com/5uIKc6y.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }



        .container {
            text-align: center;
        }

        .gameButton {
            position: relative;
            margin-left: 5vw;
            margin-right: 5vw;
            margin-top: 60px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            border: 5px solid black;
            border-radius: 20px;
            transition: 1s;
        }
        
        .gameButton:hover{
            border-color: white;
        }

        .logo {
            top: 30px;
            width:307px;
            height: 300px;
            position: relative;
            left: 50%;
            -ms-transform: translateX(-50%);
            transform: translateX(-50%);
        }

        .FAQtitle {
            text-align: center;
            font-size: 100px;
            background-color: black;
        }
        
    </style>

</head>

<body>
    <img class="logo" src="https://i.imgur.com/NVkS4qo.png">

    <div class="container">
        <button onclick="document.location.href='leagueoflegends';" id="0" class="gameButton" style="background-image: url(https://i.imgur.com/i9HH2o4.png);"></button>
        <button onclick="document.location.href='overwatch';" id="1" class="gameButton" style="background-image: url(https://i.imgur.com/Q8LGrzp.png);"></button>
        <button onclick="document.location.href='valorant';" id="2" class="gameButton" style="background-image: url(https://i.imgur.com/LpRKcR3.png);"></button>
    </div>
    


    <script>
        function updateButtonSize() {
            for (let i = 0; i < 3; i++) {
                document.getElementById(i).style.width = 250 + window.innerWidth/20 + "px";
                document.getElementById(i).style.height = 330 + window.innerWidth/12 + "px";
            } 
        }
        updateButtonSize()
        window.onresize = updateButtonSize;

    </script>

    <br><br><br><br><br><br><br>

    <div class="FAQtitle">FAQ's</div>

</body>

</html>
