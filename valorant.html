<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Dangrek' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Tauri' rel='stylesheet'>
    <link rel="stylesheet" href="/banner.css">
    <link rel="icon" href="https://bobsboosting.com/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="https://bobsboosting.com/favicon.ico" type="image/x-icon">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L5ELYSX1G0">

    <title>Bob's Boosting</title>
    
    <style>

        body {
            background-image: url('https://i.imgur.com/wOqOI0D.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            background-color: rgba(0,0,0,1);
            color: white;
        }

        .container {
            top: 150px;
            position: relative;
            display: flex;
            text-align: center;
            width: 100%;
            height: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gameButton {
            position: relative;
            margin-left: 2vw;
            margin-right: 2vw;
            margin-top: 60px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            filter: drop-shadow(0px 0px 3px lightblue);
            height: 0px;
        }

        .iron {background-image: url('https://i.imgur.com/LXeIjWK.png');}
        .bronze{background-image: url('https://i.imgur.com/CnhEMym.png')}
        .silver{background-image: url('https://i.imgur.com/DQyuAOc.png')}
        .gold{background-image: url('https://i.imgur.com/fRClGAd.png')}
        .platinum{background-image: url('https://i.imgur.com/y35FmjI.png')}
        .diamond{background-image: url('https://i.imgur.com/F1yuoUM.png');}
        .ascendant{background-image: url('https://i.imgur.com/WkKkMWr.png')}
        .immortal{background-image: url('https://i.imgur.com/HTJBoBR.png')}

        .romanNumeralButton {
            background-repeat: no-repeat;
            background-size: cover;
            width: 18%;
            aspect-ratio: 1/1;
            background-color: #04131d;
            border-radius: 10px;
            border-color: lightblue;
            font-family: 'Tauri';
            font-size: min(9vw, 50px);
            color: white;
            margin: 2%;
            padding: 0px;
        }

        .romanNumeralButton:hover{
            background-color: #072335;
        }

        .romanNumeralButton:active{
            position: relative;
            top: 2px;
        }

        .button {
            background-repeat: no-repeat;
            background-size: 100% 100%;
            width: 9.9%;
            height: 27.5%;
            background-color: #04131d;
            border-radius: 10px;
            border-color: lightblue;
            z-index: 110;
            margin: 1%;
            margin-top: 8px;
            border-width: 3px;
            border-style: solid;
        }

        .button:hover{
            background-color: #072335;
        }

        .button:active{
            position: relative;
            top: 2px;
        }

        .rankbuttons{
            width: 100%;
            height: 31%;
            position: absolute;
            background-color: #04131d;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            top: 69%;
            text-align: center;
        }

        .currentrank {
            height: 100%;
            position: relative;
            background-color: #04131d;
            border: 2px solid lightblue;
            align-items: center;
            border-radius: 5px;
        }

        .selected {
            width: 50%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-repeat: no-repeat;
            margin-left: 25%;
            filter: drop-shadow(0px 0px 40px lightblue)
        }

        .checkoutContainer{
            background-color: #04131d;
            height: 70%;
            position: relative;
            border: 2px solid lightblue;
            color: white;
            width: min(100%, 428px);
            height: 350px;
            border-radius: 5px;
        }

        .box{
            transform: scale(2);
            vertical-align: middle;
            accent-color: lightblue;
        }

        .extraboxes{
            justify-content: space-between;
            display: flex;
            color: white; 
            vertical-align: middle; 
            font-size: 18px; 
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            margin:17px;
        }

        .price{
          font-size: 25px;
          font-family: sans-serif;
          padding: 10px;
        }

        .paypalbutton{
          width: 90%;
          left: 5%;
          position: relative;
        }

        input[type="number"]{
            background-color: #072335;
            color: white;
            border: 2px solid lightblue;
            border-radius: 5px;
        }

        h1 {
            color: white; 
            font-family: 'Tauri'; 
            text-align: center; 
            text-shadow: 3px 3px 0px black;
        }

        a.highlight{
            color: lightblue;
        }

    </style>

</head>

<body>
    <div class="banner l" id="banner">
        <a class="nodec" href="https://bobsboosting.com">Home</a> 
        <a class="nodec" href="https://bobsboosting.com/login">Login</a>
        <a class="nodec" href="https://discord.gg/uvJRspbxuB">Discord</a> 
        <a class="nodec" href="https://bobsboosting.com/FAQ">FAQ</a>
    </div>
    <div class="container">
        <div id="d1" class="gameButton" >
            <div class="currentrank">
                <h1>Current Rank</h1>
                <div id="rank1" class="selected iron"></div>
                <div id="rankNumber1"><h1>1</h1></div>
                <div onclick="checkout(1)" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 1)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 1)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 1)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 1)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 1)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 1)" class="button diamond"></button>
                    <button onclick="chooseRankScript(6, 1)" class="button ascendant"></button>
                    <button onclick="chooseRankScript(7, 1)" class="button immortal"></button>
                    <div id="div1" style="width: 100%;">
                        <button onclick="chooseRankScript(8, 1)" class="romanNumeralButton">1</button>
                        <button onclick="chooseRankScript(9, 1)" class="romanNumeralButton">2</button>
                        <button onclick="chooseRankScript(10, 1)" class="romanNumeralButton">3</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="d2" class="gameButton" >
            <div class="currentrank">
                <h1>Desired Rank</h1>
                <div id="rank2" class="selected iron"></div>
                <div id="rankNumber2"><h1>1</h1></div>
                <div onclick="checkout(2)" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 2)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 2)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 2)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 2)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 2)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 2)" class="button diamond"></button>
                    <button onclick="chooseRankScript(6, 2)" class="button ascendant"></button>
                    <button onclick="chooseRankScript(7, 2)" class="button immortal"></button>
                    <div id="div2" style="width: 100%;">
                        <button onclick="chooseRankScript(8, 2)" class="romanNumeralButton">1</button>
                        <button onclick="chooseRankScript(9, 2)" class="romanNumeralButton">2</button>
                        <button onclick="chooseRankScript(10, 2)" class="romanNumeralButton">3</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="d3" class="gameButton">
            <div class="checkoutContainer">
                <h1>Checkout</h1>
                <hr style="border: 0 none; height:2px; background-color: lightblue;">

                <div class="extraboxes" onclick=toggle()>
                    <b>Play with booster (+50%)</b> <input onclick=toggle() type="checkbox" id="duobutton" class="box">
                </div>
                <div class="extraboxes">
                    <b>Additional wins</b><input type="number" id="quantity" oninput="checkout()" name="quantity" min="0" max="5"> 
                </div>
                <div class="extraboxes" id="conclusion">
                    <b>Iron 1 -> Iron 1</b>
                </div>

                <div id="price" class="price"><b>€0</b></div>             
                <div id="paypal-button-container" class="paypalbutton"></div>
                Join our <a href="https://discord.gg/uvJRspbxuB" class="highlight">discord</a> for discounts and other payment methods
                <p id="result-message"></p>
            </div>
        </div>

    </div>

    <script>
        var game = "valorant"
    </script>
    <script src="https://www.paypal.com/sdk/js?client-id=AYoxGdl5RlbEv6ye9uGExKeSLmUU24A389LM1xbVucKYz2WlMV2qmId06oEt05X39D1Tl2UX0dVexRnx&currency=EUR&disable-funding=credit,card"></script>
    <script src="/valorant.js"></script>
    <script src="/client/paypal.js"></script>
    <script src="/reformat.js"></script>
    <script>
        var banner = document.getElementById("banner")
        bannerformat()
        function reformat(){
            updateButtonSize()
            bannerformat()
        }
        window.onresize = reformat;
    </script>
</body>


</html>
