<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        .container {
            position: absolute;
            top:0px;
            left:0px;
            width:100vw;
            height: 100vh;
            background-color: #04131d;
            color: #d29c4b;
            display: flex;
            text-align: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .banner {
            width: 100vw;
            color: #d29c4b;
            height: 35px;
            background-color: #d29c4b;
        }

        .boostdetails {
            width:30%;
            height:70%;
            background-color: black;
            margin: 50px;
            flex-wrap: nowrap;
            margin-right: 60px;
            border: 5px solid #d29c4b;
            }

        .chat{
            width:55%;
            height:70%;
            background-color: black;
            margin: 50px;
            flex-wrap: nowrap;
            border: 5px solid #d29c4b;
        }

        .scrollmessages {
            margin: 5%;
            width: 90%;
            height: 80%;
            background-color: black;
            overflow: auto;
            text-align: justify;
            display: flex;
        }

        .msgbox {
            background-color: blue;
            width: 40%;
            height: 100%;
            margin-left: 2.5%;
            margin-right: 2.5%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="banner">
            
        </div>

        <div class="boostdetails">
            sds
        </div>

        <div class="chat">
            <div class="scrollmessages">
            </div>
            <form id = "form">
                <label for="message">Message</label>
                <input type="text" id="message">
                <button type="submit" id="send-button">Send</button>
            </form>
        </div>
    </div>


    <script>
        const form = document.getElementById("form")
        const message = document.getElementById("message")

        form.addEventListener("submit", arg => {
            console.log(arg)
            val = message.value
            if (val == ""){
                return
            }
            console.log("Show the message somewhere")
        })
    </script>
</body>

</html>
