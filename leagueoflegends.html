<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript"
        src="paymentlinkScript.js">
    </script>
    <style>

        body {
            background-image: url('https://i.imgur.com/5uIKc6y.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }

        .container {
            top: 120px;
            position: relative;
            display: flex;
            text-align: center;
            width: 100%;
            height: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gameButton {
            position: relative;
            margin-left: 2vw;
            margin-right: 2vw;
            margin-top: 60px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .iron {background-image: url('https://i.imgur.com/Tj2BpH3.png');}
        .bronze{background-image: url('https://i.imgur.com/sPrqDTq.png')}
        .silver{background-image: url('https://i.imgur.com/NiCijlD.png')}
        .gold{background-image: url('https://i.imgur.com/9wXycG8.png')}
        .platinum{background-image: url('https://i.imgur.com/z4I2pt9.png')}
        .emerald{background-image: url('https://i.imgur.com/iltHUX5.png');}
        .diamond{background-image: url('https://i.imgur.com/fy4NjAA.png')}
        .master{background-image: url('https://i.imgur.com/gAhdiIa.png')}

        .romanNumeralButton {
            background-repeat: no-repeat;
            background-size: cover;
            width: 18%;
            height: 50%;
            background-color: #04131d;
            border-radius: 10px;
            border-color: #d29c4b;
            font-family: 'Times New Roman', Times, serif;
            font-size: 70px;
            color: #d29c4b;
            margin: 10px;
        }

        .button {
            background-repeat: no-repeat;
            background-size: 100% 100%;
            width: 9.9%;
            height: 27.5%;
            background-color: #04131d;
            border-radius: 10px;
            border-color: #d29c4b;
            z-index: 110;
            margin: 4px;
            margin-top: 8px;
        }

        .rankbuttons{
            width: 100%;
            height: 31%;
            position: absolute;
            background-color: #04131d;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            top: 69%;
            text-align: center;
        }

        .currentrank {
            height: 100%;
            position: relative;
            background-color: #04131d;
            border: 5px solid #d29c4b;
            color: #d29c4b;
        }

        .selected {
            width: 50%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-repeat: no-repeat;
            margin-left: 25%;
        }

        .checkoutButton {
            width: 90%;
            height: 25%;
            background-color: #000662;
            border-radius: 5px;
            border-color: #d29c4b;
            border-width: 4px;
        }

        .checkoutContainer{
            background-color: #04131d;
            height: 70%;
            position: relative;
            border: 5px solid #d29c4b;
            color: #d29c4b;
            width: 428px;
            height: 350px;
        }

        .box{
            transform: scale(2);
            vertical-align: middle;
        }

        .extraboxes{
            justify-content: space-between;
            display: flex;
            color: white; 
            vertical-align: middle; 
            font-size: 18px; 
            font-family: Arial, Helvetica, sans-serif;
            color: #d29c4b;
            margin:25px;
        }

    </style>

</head>

<body>
    <div class="container">
        <div id="d1" class="gameButton" >
            <div class="currentrank">
                <h1 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; text-align: center;"><b>Current Rank</b></h1>
                <div id="rank1" class="selected iron"></div>
                <div id="rankNumber1" style="font-size: 40px; font-family: 'Times New Roman', Times, serif; color: #d29c4b;">IV</div>
                <div onclick="checkout()" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 1)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 1)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 1)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 1)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 1)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 1)" class="button emerald"></button>
                    <button onclick="chooseRankScript(6, 1)" class="button diamond"></button>
                    <button onclick="chooseRankScript(7, 1)" class="button master"></button>
                    <div id="div1" style="width: 100%;">
                        <button onclick="chooseRankScript(8, 1)" class="romanNumeralButton">IV</button>
                        <button onclick="chooseRankScript(9, 1)" class="romanNumeralButton">III</button>
                        <button onclick="chooseRankScript(10, 1)" class="romanNumeralButton">II</button>
                        <button onclick="chooseRankScript(11, 1)" class="romanNumeralButton">I</button>
                    </div> 
                </div>
            </div>
        </div>

        <div id="d2" class="gameButton" >
            <div class="currentrank">
                <h1 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Desired Rank</b></h1>
                <div id="rank2" class="selected iron"></div>
                <div id="rankNumber2" style="font-size: 40px; font-family: 'Times New Roman', Times, serif; color: #d29c4b;">IV</div>
                <div onclick="checkout()" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 2)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 2)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 2)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 2)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 2)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 2)" class="button emerald"></button>
                    <button onclick="chooseRankScript(6, 2)" class="button diamond"></button>
                    <button onclick="chooseRankScript(7, 2)" class="button master"></button>
                    <div id="div2" style="width: 100%;">
                        <button onclick="chooseRankScript(8, 2)" class="romanNumeralButton">IV</button>
                        <button onclick="chooseRankScript(9, 2)" class="romanNumeralButton">III</button>
                        <button onclick="chooseRankScript(10, 2)" class="romanNumeralButton">II</button>
                        <button onclick="chooseRankScript(11, 2)" class="romanNumeralButton">I</button> <!--I hate it-->
                    </div>
                </div>
            </div>
        </div>
        
        <div id="d3" class="gameButton">
            <div class="checkoutContainer">
                <h1 style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Checkout</b></h1>
                <h2 id="conclusion" style="font-family: Arial, Helvetica, sans-serif">Iron IV → Iron IV</h2>                


                <hr style="border: 0 none; height:5px; background-color: #d29c4b;">

                <div class="extraboxes" onclick=toggle()>
                    <b>Play with booster (+50%)</b> <input onclick=toggle() type="checkbox" id="duobutton" class="box">
                </div>
                <div class="extraboxes">
                    <b>Additional wins</b><input type="number" id="quantity" oninput="checkout()" name="quantity" min="0" max="4"> 
                </div>
                
                <button onclick="realCheckout()" id="checkoutPayment" class="checkoutButton" style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 30px;" >£0 - Proceed to Payment</button>
            </div>
        </div>

    </div>

    <script>
        // Globals cause fuck it XD
        const ranks = ["Iron", "Bronze", "Silver", "Gold", "Platinum", "Emerald", "Diamond", "Master", "IV", "III", "II", "I", " "];
        
        // ffoawgopak my life but these are the variables that will be used to calculate payment
        var rankStore= ["Iron", "Iron"]
        var divisionStore = ["IV", "IV"]
        var s = 0;

        function toggle(){
            x = document.getElementById("duobutton");
            if (x.checked == false){
                x.checked = true;
            } 
            else {
                x.checked = false;
            }
            checkout();
        }

        function updateButtonSize() {
            const idarray = ["d1", "d2"]
            for (let i = 0; i < 2; i++) {
                document.getElementById(idarray[i]).style.width = 400 + window.innerWidth/20 + "px";
                document.getElementById(idarray[i]).style.height = 462 + window.innerWidth/12 + "px";
            } 
            if (window.innerWidth < 1635){
                document.getElementById("d3").style.top = "0px";
            }
            else{
                document.getElementById("d3").style.top = "120px";
            }
        }

        function chooseRankScript(x, oneOrTwo) {
            newRank = ranks[x];

            if (x <= 7) {
                if (newRank=="Master"){
                    if (oneOrTwo==1){
                        document.getElementById("rankNumber" + "1").innerHTML = "<input type='number' oninput='checkout()' id='LP' name='LPname' min='0' max='1500'><br>LP";
                        document.getElementById("div1").innerHTML = "";
                        divisionStore[0] = " ";
                    }
                    document.getElementById("div2").innerHTML = "Use the 'Additional Wins' to decide how many wins you want in master elo."
                    temp = document.getElementById("rank" + "2");
                    temp.classList = ["selected"];
                    temp.classList.add("master");
                    document.getElementById("rankNumber" + "2").innerHTML = "";
                    rankStore[1] = "Master";
                    divisionStore[1] = " ";
                }
                else if (rankStore[oneOrTwo-1]=="Master"){
                    romanButtons(oneOrTwo);
                }
                rankImage = document.getElementById("rank" + oneOrTwo);
                rankImage.classList = ["selected"]
                rankImage.classList.add(newRank.toLowerCase());
                rankStore[oneOrTwo-1] = newRank;
            }
            else {
                rankNumber = document.getElementById("rankNumber" + oneOrTwo);
                rankNumber.innerHTML = newRank;
                divisionStore[oneOrTwo-1] = newRank;
            }
            conclusion = document.getElementById("conclusion");
            conclusion.innerHTML = rankStore[0] + " " + divisionStore[0] + " " + "→" +  " " + rankStore[1] + " " + divisionStore[1]
        }

        // Prices 
        const prices = [3,3,3,4, 5,5,5,6, 7,7,7,8, 9,9,9,10, 11,11,11,12, 13,15,17,19, 25,30,35,40, 50, 60, 70, 80, 90, 100, 110, 120, 130]
        function checkout(){
            if (rankStore[0]=="Master"){
                s = Math.ceil(document.getElementById("quantity").value*(15 + document.getElementById("LP").value/40))
            }
            else{
                startIndex = ranks.indexOf(rankStore[0])*4 + ranks.indexOf(divisionStore[0])-8;
                endIndex = ranks.indexOf(rankStore[1])*4 + ranks.indexOf(divisionStore[1])-8;
                s = 0
                prices.slice(startIndex, endIndex).forEach(x => s+=x);
                s += document.getElementById("quantity").value*prices[endIndex]/4
            }
            so = s
            if (document.getElementById("duobutton").checked == true){
                so = so*1.5;
            }
            so = Math.floor(so);
            document.getElementById("checkoutPayment").innerHTML = "£" + so + " - Proceed to Payment";
        }

        function realCheckout(){
            var v = ""
            if (document.getElementById("duobutton").checked == true){
                v = "D"
            }
            else{
                v = "S"
            }

            if (s > 0){
                let req = new XMLHttpRequest();
                req.onreadystatechange = () => {
                if (req.readyState == XMLHttpRequest.DONE) {
                    let a = Test.links;
                    window.location.assign(links[so-1])
                }
                };
                
                req.open("POST", "https://api.jsonbin.io/v3/b", true);
                req.setRequestHeader("Content-Type", "application/json");
                req.setRequestHeader("X-Master-Key", "$2a$10$mO7aTU/7xg/g.pdXQaJZxOC.pfR/S70.ApHloIuRK9jmV0kiouQ/m");
                req.send('{"' + document.getElementById("quantity").value + v + rankStore[0] + divisionStore[0] + rankStore[1] + divisionStore[1] + '": "' + so + '"}');
            }
        }

        function romanButtons(oort){
            if (oort == 2){
                document.getElementById("div2").innerHTML = "<button onclick='chooseRankScript(8, 2)' class='romanNumeralButton'>IV</button><button onclick='chooseRankScript(9, 2)' class='romanNumeralButton'>III</button><button onclick='chooseRankScript(10, 2)' class='romanNumeralButton'>II</button><button onclick='chooseRankScript(11, 2)' class='romanNumeralButton'>I</button>";
                document.getElementById("rankNumber" + "2").innerHTML = "IV";
                divisionStore[1] = "IV"
            }
            document.getElementById("div1").innerHTML = "<button onclick='chooseRankScript(8, 1)' class='romanNumeralButton'>IV</button><button onclick='chooseRankScript(9, 1)' class='romanNumeralButton'>III</button><button onclick='chooseRankScript(10, 1)' class='romanNumeralButton'>II</button><button onclick='chooseRankScript(11, 1)' class='romanNumeralButton'>I</button>";
            document.getElementById("rankNumber" + "1").innerHTML = "IV";
            divisionStore[0] = "IV"
            rankStore[0] = "Diamond";
            chooseRankScript(6, 1);
        }

        document.getElementById("quantity").value = 0;
        document.getElementById("duobutton").checked = false;
        updateButtonSize();
        window.onresize = updateButtonSize;

    </script>
    

</body>


</html>
