<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body {
            background-image: url('https://i.imgur.com/5uIKc6y.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }

        .container {
            top: 120px;
            position: relative;
            display: flex;
            text-align: center;
            width: 100%;
            height: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gameButton {
            position: relative;
            margin-left: 2vw;
            margin-right: 2vw;
            margin-top: 60px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            border: 1px solid black;
        }

        .iron {background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/f/f8/Season_2023_-_Iron.png/revision/latest?cb=20231007195831');}
        .bronze{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/c/cb/Season_2023_-_Bronze.png/revision/latest?cb=20231007195824')}
        .silver{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/c/c4/Season_2023_-_Silver.png/revision/latest?cb=20231007195834')}
        .gold{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/7/78/Season_2023_-_Gold.png/revision/latest?cb=20231007195829')}
        .platinum{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/b/bd/Season_2023_-_Platinum.png/revision/latest?cb=20231007195833')}
        .diamond{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/3/37/Season_2023_-_Diamond.png/revision/latest?cb=20231007195826')}
        .master{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/d/d5/Season_2023_-_Master.png/revision/latest?cb=20231007195832')}
        .grandmaster{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/6/64/Season_2023_-_Grandmaster.png/revision/latest?cb=20231007195830')}
        .challenger{background-image: url('https://static.wikia.nocookie.net/leagueoflegends/images/1/14/Season_2023_-_Challenger.png/revision/latest?cb=20231007195825')}

        .romanNumeralButton {
            background-repeat: no-repeat;
            background-size: cover;
            width: 18%;
            height: 50%;
            background-color: #04131d;
            border-radius: 10px;
            border-color: #d29c4b;
            font-family: 'Times New Roman', Times, serif;
            font-size: 70px;
            color: #d29c4b;
            margin: 10px;
        }

        .button {
            background-repeat: no-repeat;
            background-size: 100% 100%;
            width: 9%;
            height: 25%;
            background-color: #04131d;
            border-radius: 10px;
            border-color: #d29c4b;
            z-index: 110;
            margin: 4px;
            margin-top: 8px;
        }

        .rankbuttons{
            width: 100%;
            height: 31%;
            position: absolute;
            background-color: #04131d;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            top: 69%;
            text-align: center;
        }

        .currentrank {
            height: 100%;
            position: relative;
            background-color: #04131d;
            border: 5px solid #d29c4b;
            align-items: center;
        }

        .selected {
            width: 50%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-repeat: no-repeat;
            margin-left: 25%;
        }

        .checkoutButton {
            width: 90%;
            height: 13%;
            background-color: #000662;
            border-radius: 5px;
            border-color: #d29c4b;
            border-width: 4px;
        }

    </style>

</head>

<body>
    <div class="container">
        <div id="d1" class="gameButton" >
            <div class="currentrank">
                <h1 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Current Rank</b></h1>
                <div id="rank1" class="selected iron"></div>
                <div id="rankNumber1" style="font-size: 40px; font-family: 'Times New Roman', Times, serif; color: #d29c4b;">IV</div>
                <div onclick="checkout()" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 1)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 1)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 1)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 1)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 1)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 1)" class="button diamond"></button>
                    <button onclick="chooseRankScript(6, 1)" class="button master"></button>
                    <button onclick="chooseRankScript(7, 1)" class="button grandmaster"></button>
                    <button onclick="chooseRankScript(8, 1)" class="button challenger"></button>
                    <button onclick="chooseRankScript(9, 1)" class="romanNumeralButton">IV</button>
                    <button onclick="chooseRankScript(10, 1)" class="romanNumeralButton">III</button>
                    <button onclick="chooseRankScript(11, 1)" class="romanNumeralButton">II</button>
                    <button onclick="chooseRankScript(12, 1)" class="romanNumeralButton">I</button> 
                </div>
            </div>
        </div>

        <div id="d2" class="gameButton" >
            <div class="currentrank">
                <h1 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Desired Rank</b></h1>
                <div id="rank2" class="selected iron"></div>
                <div id="rankNumber2" style="font-size: 40px; font-family: 'Times New Roman', Times, serif; color: #d29c4b;">IV</div>
                <div onclick="checkout()" class="rankbuttons"> 
                    <button onclick="chooseRankScript(0, 2)" class="button iron"></button>
                    <button onclick="chooseRankScript(1, 2)" class="button bronze"></button>
                    <button onclick="chooseRankScript(2, 2)" class="button silver"></button>
                    <button onclick="chooseRankScript(3, 2)" class="button gold"></button>
                    <button onclick="chooseRankScript(4, 2)" class="button platinum"></button>
                    <button onclick="chooseRankScript(5, 2)" class="button diamond"></button>
                    <button onclick="chooseRankScript(6, 2)" class="button master"></button>
                    <button onclick="chooseRankScript(7, 2)" class="button grandmaster"></button>
                    <button onclick="chooseRankScript(8, 2)" class="button challenger"></button>
                    <button onclick="chooseRankScript(9, 2)" class="romanNumeralButton">IV</button>
                    <button onclick="chooseRankScript(10, 2)" class="romanNumeralButton">III</button>
                    <button onclick="chooseRankScript(11, 2)" class="romanNumeralButton">II</button>
                    <button onclick="chooseRankScript(12, 2)" class="romanNumeralButton">I</button> <!--I hate it-->
                </div>
            </div>
        </div>
        
        <div id="d3" class="gameButton">
            <div class="currentrank">
                <div></div> <!--Bobs boosting logo here ig-->
                <h1 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Checkout</b></h1>
                <hr style="border: 0 none; height:5px; background-color: #d29c4b;">
                <h2 style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"><b>Silver IV -> Silver I</b></h2>                
                <button onclick="realCheckout()" id="checkoutPayment" class="checkoutButton" style="color: #d29c4b; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 30px;" >£0 - Proceed to Payment</button>
            </div>
        </div>

    </div>

    <script>
        // Globals cause fuck it XD
        const ranks = ["iron", "bronze", "silver", "gold", "platinum", "diamond", "master", "grandmaster", "challenger", "IV", "III", "II", "I"];
        
        // ffoawgopak my life but these are the variables that will be used to calculate payment
        var rankStore= ["iron", "iron"]
        var divisionStore = ["IV", "IV"]
        var s = 0;

        function updateButtonSize() {
            const idarray = ["d1", "d2", "d3"]
            for (let i = 0; i < 3; i++) {
                document.getElementById(idarray[i]).style.width = 400 + window.innerWidth/20 + "px";
                document.getElementById(idarray[i]).style.height = 462 + window.innerWidth/12 + "px";
            } 
        }

        function chooseRankScript(x, oneOrTwo) {
            newRank = ranks[x];

            if (x <= 8) {
                rankImage = document.getElementById("rank" + oneOrTwo);
                rankImage.classList = ["selected"]
                rankImage.classList.add(newRank);
                rankStore[oneOrTwo-1] = newRank;
            }
            else {
                rankNumber = document.getElementById("rankNumber" + oneOrTwo);
                rankNumber.innerHTML = newRank;
                divisionStore[oneOrTwo-1] = newRank;
            }
        }

        // Prices 
        const prices = [3,3,3,4, 5,5,5,6, 7,7,7,8, 9,9,9,10, 11,11,11,12, 13,15,17,19, 25,30,35,40]
        function checkout(){
            startIndex = ranks.indexOf(rankStore[0])*4 + ranks.indexOf(divisionStore[0])-9;
            endIndex = ranks.indexOf(rankStore[1])*4 + ranks.indexOf(divisionStore[1])-9;
            s = 0
            prices.slice(startIndex, endIndex).forEach(x => s+=x);
            document.getElementById("checkoutPayment").innerHTML = "£" + s + " - Proceed to Payment";
        }

        function realCheckout(){
            let req = new XMLHttpRequest();
            req.onreadystatechange = () => {
            if (req.readyState == XMLHttpRequest.DONE) {
                console.log(req.responseText);
            }
            };
            
            req.open("POST", "https://api.jsonbin.io/v3/b", true);
            req.setRequestHeader("Content-Type", "application/json");
            req.setRequestHeader("X-Master-Key", "$2a$10$mO7aTU/7xg/g.pdXQaJZxOC.pfR/S70.ApHloIuRK9jmV0kiouQ/m");
            req.send('{"' + rankStore[0] + divisionStore[0] + rankStore[1] + divisionStore[1] + '": "' + s + '"}');
        }



        updateButtonSize();
        window.onresize = updateButtonSize;

    </script>
    

</body>


</html>
